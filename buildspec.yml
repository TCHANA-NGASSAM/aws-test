version: 0.2

phases:
  install:
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Building the project..."
  build:
    commands:
      - echo "Building the project..."
      - pytest --junitxml=reports/results.xml --tb=short
  post_build:
    commands:
      - echo "Post build phase"

artifacts:
  files:
    - "**/*"
  base-directory: .
  reports:
    pytest_reports:
      files:
        - "reports/results.xml"
  discard-paths: yes